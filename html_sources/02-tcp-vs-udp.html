 osc.connect(gn);out(gn,o);osc.start(t0);osc.stop(t0+dur+.06)}

 const len=Math.max(1,(dur+.05)*ac.sampleRate|0),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;

 const AR=[440,523.25,659.25,784,659.25,523.25,440,392];
 for(let i=0;i<40;i++){const t=t0+3+i*.25,v=.02+.03*clamp(i/20,0,1);if(t>t0+11.6)break;

function deliver(i){S.tiles.L[i]=2;S.cnt.L++;setNum('L');sfx.arrL(i+1);ring(FR.L.x+(i%4)*30+14,FR.L.y+Math.floor(i/4)*30+14,170+i*4);
 if(S.cnt.L===12){S.flash.L=E;sfx.chord();$('#stL').classList.add('show');flt('12/12 · in order',165,520,'#37e0b0');burst(165,592,165,30)}}
function lost(p){const q=bez(p.side,p.drop);burst(q[0],q[1],p.h);sfx.crack(p.side==='L'?-.5:.5);
 if(p.side==='R'){S.tiles.R[p.n-1]=-1;ring(q[0],q[1],0)}else flt('lost #'+p.n,q[0],q[1]-20,'#ff7fa3')}

/* ================= timeline ================= */
function buildTimeline(){
 const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{$('#srv').classList.add('show');sfx.zap();ring(270,258,215)});
 a(1.9,()=>{S.tubeOn=E;sfx.whoosh(.55,.12)});
 a(2.3,()=>{$('#sL').classList.add('show');$('#sR').classList.add('show');tone({f:300,dur:.2,vol:.06})});
 a(2.6,()=>{S.frOn=E;$('#cL').classList.add('show');$('#cR').classList.add('show');sfx.chord(.035)});
 /* TCP handshake */
 a(3.0,()=>{flt('no handshake. just send.',375,420,'#ffb454');send('L',{lab:'SYN',kind:'syn',dur:.6,h:190})});
 a(3.6,()=>send('L',{lab:'SYN-ACK',kind:'sa',dir:-1,dur:.6,h:150}));
 a(4.2,()=>send('L',{lab:'ACK',kind:'syn',dur:.6,h:190,done:()=>{flt('connected ✓',165,430,'#37e0b0');tone({f:660,dur:.12,vol:.08,pan:-.5});tone({f:990,dur:.25,vol:.08,at:.1,pan:-.5})}}));
 /* UDP: 12 packets, 3 dropped */
 for(let k=0;k<12;k++)a(3.4+k*.22,()=>send('R',{n:k+1,dur:.85,drop:[4,7,10].includes(k+1)?.55:null}));
 a(6.85,()=>{S.udpDone=E;sfx.glitch();$('#stR').classList.add('show');flt('done. nobody checked.',375,500,'#ffb454')});
 /* TCP: 12 packets, #5 lost then resent */
 for(let k=0;k<12;k++)a(5.0+k*.5,()=>send('L',{n:k+1,dur:1.05,drop:k===4?.55:null}));
 a(8.3,()=>{sfx.warn();flt('TIMEOUT · RESEND #5',165,470,'#ffb454');ring(165,420,38)});
 a(8.4,()=>send('L',{n:5,kind:'resend',dur:1.05,h:38}));
 /* ending */
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact();S.flash.L=S.flash.R=E});
 a(14.2,()=>{});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');
 $('#stL').classList.remove('show');$('#stR').classList.remove('show');$('#nL').textContent='0/12';$('#nR').textContent='0/12';fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 for(const p of S.pk.slice()){const u=(E-p.t0)/p.dur;if(u<0)continue;
  if(p.drop!=null&&p.dir>0&&u>=p.drop){S.pk.splice(S.pk.indexOf(p),1);lost(p);continue}
  if(u>=1){S.pk.splice(S.pk.indexOf(p),1);arrive(p)}}
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const ta=ease((E-S.tubeOn)/.7)*(S.tubeOn>0?1:0);
 /* tubes */
 if(ta>0)for(const s of['L','R']){const col=s==='L'?'55,224,176':'255,180,84';
  g.lineWidth=22;g.lineCap='round';g.strokeStyle=`rgba(${col},${.05*ta})`;g.beginPath();for(let i=0;i<=40;i++){const p=bez(s,i/40);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke();
  g.lineWidth=1.3;g.strokeStyle=`rgba(140,170,230,${.38*ta})`;WALL[s].forEach(w=>{g.beginPath();w.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()});
  g.setLineDash([2,10]);g.lineDashOffset=-E*34;g.lineWidth=1.6;g.strokeStyle=`rgba(${col},${.5*ta})`;g.beginPath();for(let i=0;i<=40;i++){const p=bez(s,i/40);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke();g.setLineDash([])}
 /* frames */
 const fa=ease((E-S.frOn)/.6)*(S.frOn>0?1:0);
 if(fa>0)for(const s of['L','R']){const F=FR[s],T=S.tiles[s],fl=Math.exp(-(E-S.flash[s])*3);
  const jit=s==='R'&&E-S.udpDone<.7?(R(Math.floor(E*30),1,1)-.5)*5*(1-(E-S.udpDone)/.7):0;
  g.globalAlpha=fa;g.strokeStyle=s==='L'?'rgba(55,224,176,.45)':'rgba(255,180,84,.45)';g.lineWidth=1.4;rr(F.x-6,F.y-6,130,100,10);g.stroke();
  for(let i=0;i<12;i++){const tx=F.x+(i%4)*30+(T[i]===-1?jit:0),ty=F.y+Math.floor(i/4)*30,st=T[i];
   g.fillStyle='rgba(18,26,46,.92)';rr(tx,ty,28,28,4);g.fill();g.strokeStyle='rgba(120,150,210,.22)';g.lineWidth=1;g.stroke();
   if(st>=1.5||st===1){g.globalAlpha=fa*(st===1?.32:1);g.drawImage(IMG,(i%4)*60,Math.floor(i/4)*58.6,60,58.6,tx,ty,28,28);g.globalAlpha=fa;
    if(st===1){g.setLineDash([3,3]);g.strokeStyle='rgba(255,180,84,.9)';rr(tx,ty,28,28,4);g.stroke();g.setLineDash([])}}
   if(st===-1){const k=Math.floor(E*9);for(let j=0;j<4;j++){g.fillStyle=`hsla(${R(i,j,k)*360},90%,60%,${.35+.3*R(j,i,k)})`;g.fillRect(tx+2,ty+3+R(i,j,k+9)*20,24,2.5)}
    g.strokeStyle='rgba(255,90,120,.7)';g.lineWidth=1.2;rr(tx,ty,28,28,4);g.stroke()}}
  if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.35*fl*fa})`;rr(F.x-6,F.y-6,130,100,10);g.fill();g.globalCompositeOperation='source-over'}
  g.globalAlpha=1}
 g.globalCompositeOperation='lighter';
 /* packets */
 for(const p of S.pk){const u=clamp((E-p.t0)/p.dur,0,1);if(E<p.t0)continue;const uu=p.dir>0?u:1-u;
  for(let k=5;k>=1;k--){const q=bez(p.side,clamp(uu-p.dir*k*.014,0,1));glow(q[0],q[1],9+k,p.h,.09*(6-k)*(p.kind==='ack'?.6:1))}
  const q=bez(p.side,uu);glow(q[0],q[1],p.kind==='ack'?12:22,p.h,.9);
  if(p.kind==='ack'){g.fillStyle='hsl(160,90%,75%)';g.beginPath();g.arc(q[0],q[1],3.4,0,7);g.fill();continue}
  g.globalCompositeOperation='source-over';const w=p.lab.length>3?46:26;g.fillStyle=`hsl(${p.h},88%,${p.kind==='resend'?62:58}%)`;rr(q[0]-w/2,q[1]-8,w,16,5);g.fill();
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1;g.stroke();g.fillStyle='#07101c';g.font='700 9px "JetBrains Mono",ui-monospace,monospace';g.textAlign='center';g.fillText(p.lab,q[0],q[1]+3.3);g.globalCompositeOperation='lighter'}
 /* sparks + rings */
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=120*dt;glow(s.x,s.y,6,s.h,a)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const a=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-a})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+a*34,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');   /* hint: tap once to enable sound */
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);   /* starts by itself, so the first frame is the beginning */
})();
