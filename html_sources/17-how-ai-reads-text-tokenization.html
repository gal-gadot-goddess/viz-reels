function flt(txt,x,y,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;fx.appendChild(d);setTimeout(()=>d.remove(),1950)}
const total=()=>S.words.reduce((a,w)=>a+w.f*w.tokens.length,0);
function burst(x,y,h,n=12){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=30+Math.random()*90;S.sp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+Math.random()*.4,t:E,h:h+Math.random()*30-15})}}
function pre(i){const m=MERGES[i];S.top=m.top;S.hl=[m.a,m.b];S.hlT=E;sfx.pair(i)}
function doMerge(i){const m=MERGES[i];S.vm[m.s]=i;S.mi=i;S.hl=null;
 S.words.forEach(w=>{for(let k=0;k<w.tokens.length-1;k++){const A=w.tokens[k],Bt=w.tokens[k+1];if(A.s===m.a&&Bt.s===m.b){const nt={s:m.s,x:A.x,w:Bt.x+Bt.w-A.x,tx:0,tw:0,flash:E};w.tokens.splice(k,2,nt);burst(nt.x+nt.w/2,w.y+17,170+i*17,8)}}layout(w)});
 S.vocab.push(m.s);sfx.merge(i);S.flash=E}
window.__bpe={st:()=>({mi:S.mi,total:total(),vocab:S.vocab.length,words:S.words.map(w=>w.tokens.map(t=>t.s).join('|'))})};

/* ================= timeline ================= */
function buildTimeline(){
 const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.6,.12);for(let k=0;k<12;k++)at(E+k*.05,()=>sfx.pair(k))});
 a(2.6,()=>flt('79 character tokens. too many.',250,242,'#e9eff8'));
 a(3.0,()=>flt('rule: merge the most frequent pair',250,242,'#67e8f9'));
 MT.forEach((t,i)=>{a(t-.5,()=>pre(i));a(t,()=>doMerge(i))});
 a(6.2,()=>flt('frequent pairs fuse into new tokens',250,242,'#67e8f9'));
 a(10.85,()=>flt(`79 → ${16} tokens`,250,242,'#6ee7b7'));
 a(11.0,()=>{S.ids=E;S.flash=E;sfx.chord(.07);for(let k=0;k<4;k++)at(E+k*.12,()=>sfx.idr(k));flt('every token gets an ID number',250,242,'#ff6ec7')});
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact();S.flash=E});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function stat(x,label,val,hue,al,align){g.textAlign=align;g.fillStyle=`rgba(150,170,210,${.85*al})`;g.font=`700 9px ${MONO}`;g.fillText(label,x,706);
 g.fillStyle=`hsla(${hue},95%,72%,${al})`;g.font='800 28px "Outfit",system-ui,sans-serif';g.fillText(val,x,736)}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 const k=1-Math.exp(-dt*14);
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const pa=ease((E-S.on)/.7)*(S.on>0?1:0),fl=Math.exp(-(E-S.flash)*2.5);
 if(pa>0){g.globalCompositeOperation='lighter';glow(250,420,300,230,.12+.2*fl);g.globalCompositeOperation='source-over';g.globalAlpha=pa;
  /* words + tiles */
  S.words.forEach((w,wi)=>{const ra=ease((E-S.on-wi*.12)/.4);g.globalAlpha=pa*ra;
   w.tokens.forEach(t=>{t.x+=(t.tx-t.x)*k;t.w+=(t.tw-t.w)*k;
    const h=hueOf(t.s,S.vm),hl=S.hl&&(t.s===S.hl[0]||t.s===S.hl[1])?.5+.5*Math.sin((E-S.hlT)*14):0,fa=Math.exp(-(E-t.flash)*3);
    g.globalCompositeOperation='lighter';if(hl>0||fa>.05)glow(t.x+t.w/2,w.y+17,t.w*.8+18,h,.35*hl+.6*fa);g.globalCompositeOperation='source-over';
    g.fillStyle=`hsla(${h},${t.s.length===1?35:75}%,${t.s.length===1?42:50}%,${.22+.15*fa+.12*hl})`;rr(t.x,w.y,t.w,34,7);g.fill();
    g.strokeStyle=`hsla(${h},${t.s.length===1?50:92}%,${66+10*hl}%,${.8+.2*hl})`;g.lineWidth=1.2+hl;g.stroke();
    g.fillStyle='#fff';g.font=`800 14px ${MONO}`;g.textAlign='center';g.fillText(t.s,t.x+t.w/2,w.y+22);
    if(S.ids>0&&w.tokens.length===1){const ia=ease((E-S.ids-wi*.12)/.35);g.fillStyle=`hsla(${h},90%,78%,${ia})`;g.font=`800 9px ${MONO}`;g.fillText('id '+(256+MERGES.findIndex(m=>m.s===t.s)),t.x+t.w/2,w.y+46)}});
   const last=w.tokens[w.tokens.length-1];g.fillStyle='rgba(180,195,225,.8)';g.font=`800 11px ${MONO}`;g.textAlign='left';g.fillText('×'+w.f,Math.max(last.x+last.w+10,190),w.y+22)});
  g.globalAlpha=pa;
  /* leaderboard of pairs */
  const lx=300;g.fillStyle='rgba(150,170,210,.85)';g.font=`700 8.5px ${MONO}`;g.textAlign='left';g.fillText('TOP PAIRS',lx,283);
  for(let r=0;r<4;r++){const e=S.top[r],y=294+r*26;if(!e)continue;const top=r===0&&S.hl,pu=top?.6+.4*Math.sin((E-S.hlT)*14):0;
   g.fillStyle=`rgba(103,232,249,${.08+.12*pu})`;rr(lx,y,150,20,6);g.fill();g.strokeStyle=`rgba(103,232,249,${top?.5+.5*pu:.25})`;g.lineWidth=top?1.6:1;g.stroke();
   g.fillStyle=top?'#fff':'rgba(200,215,240,.85)';g.font=`800 11px ${MONO}`;g.fillText(e.p[0]+' + '+e.p[1],lx+8,y+14);g.textAlign='right';g.fillText(e.n,lx+142,y+14);g.textAlign='left'}
  /* vocabulary chips */
  g.fillStyle='rgba(150,170,210,.85)';g.font=`700 8.5px ${MONO}`;g.fillText('LEARNED VOCABULARY',46,498);
  let vx=46,vy=512;S.vocab.forEach((v,i)=>{const w=v.length*8+18;if(vx+w>454){vx=46;vy+=30}const a=ease((E-(MT[i]||0))/.35),h=170+i*17;
   g.globalAlpha=pa*a;g.fillStyle=`hsla(${h},75%,50%,.2)`;rr(vx,vy,w,22,8);g.fill();g.strokeStyle=`hsla(${h},92%,68%,.9)`;g.lineWidth=1.1;g.stroke();g.fillStyle='#fff';g.font=`800 11px ${MONO}`;g.textAlign='center';g.fillText(v,vx+w/2,vy+15);vx+=w+8;g.textAlign='left'});
  g.globalAlpha=1;
  if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.08*fl})`;g.fillRect(0,0,540,960)}}
 g.globalCompositeOperation='lighter';S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=80*dt;glow(s.x,s.y,6,s.h,a)}
 g.globalCompositeOperation='source-over';g.globalAlpha=1;
 const sa=ease((E-2.4)/.4)*(1-ease((E-12.2)/.3));
 if(sa>.01){const tt=total();stat(36,'TOKENS',tt.toString(),190,sa,'left');stat(250,'MERGES',(S.mi+1)+' / 12',45,sa,'center');stat(460,'VOCAB SIZE',(10+S.vocab.length).toString(),320,sa,'right')}
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');   /* hint: tap once to enable sound */
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);   /* starts by itself, so the first frame is the beginning */
})();
</script>
