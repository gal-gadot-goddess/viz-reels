function flt(txt,x,y,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;fx.appendChild(d);setTimeout(()=>d.remove(),1950)}
const tx=j=>X0+j*PIT+PIT/2-2;
window.__att={row:i=>AT[i].map(v=>+v.toFixed(3)),sum:AT.map(r=>+r.reduce((a,b)=>a+b,0).toFixed(3))};

/* ================= timeline ================= */
function buildTimeline(){
 const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.6,.12);for(let k=0;k<8;k++)at(E+k*.07,()=>sfx.qb(k))});
 a(2.4,()=>flt('"the cat drank milk because it was thirsty"',250,242,'#e9eff8'));
 /* detailed pass: query = "it" */
 a(3.0,()=>{S.q=5;S.qT=E;S.qi=0;sfx.sel();flt('query: "it" — who am I?',250,242,'#ffb454')});
 a(3.7,()=>{flt('1 · compare "it" with every word (Q · K)',250,242,'#67e8f9');for(let j=0;j<NT;j++)at(E+j*.1,()=>sfx.score(SC[5][j],j))});
 a(5.0,()=>{flt('2 · softmax turns scores into weights',250,242,'#ff6ec7');for(let j=0;j<NT;j++)if(AT[5][j]>.04)at(E+j*.06,()=>sfx.soft(j,AT[5][j]))});
 a(5.9,()=>{S.rowT[5]=E;for(let j=0;j<NT;j++)at(E+j*.05,()=>sfx.row(j,AT[5][j]))});
 a(6.2,()=>flt('"it" is looking mostly at "cat"',250,242,'#6ee7b7'));
 /* quick pass over the other words */
 ORDER.slice(1).forEach((qi,n)=>{const t=QT[n+1];a(t,()=>{S.q=qi;S.qT=E;S.qi=n+1;sfx.qb(qi);S.rowT[qi]=E;for(let j=0;j<NT;j++)at(E+j*.03,()=>sfx.row(j,AT[qi][j]))})});
 a(10.35,()=>{S.q=-1;S.done=E;S.flash=E;sfx.chord(.07);flt('this grid is the attention map',250,242,'#6ee7b7')});
 a(11.0,()=>flt('real models run many of these in parallel',250,242,'#e9eff8'));
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact();S.flash=E});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function stat(x,label,val,hue,al,align){g.textAlign=align;g.fillStyle=`rgba(150,170,210,${.85*al})`;g.font=`700 9px ${MONO}`;g.fillText(label,x,706);
 g.fillStyle=`hsla(${hue},95%,72%,${al})`;g.font='800 26px "Outfit",system-ui,sans-serif';g.fillText(val,x,736)}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const pa=ease((E-S.on)/.7)*(S.on>0?1:0),fl=Math.exp(-(E-S.flash)*2.5),q=S.q>=0?S.q:(S.done>0?-1:-1),detail=S.qi===0&&q===5;
 const sinceQ=E-S.qT;
 if(pa>0){g.globalCompositeOperation='lighter';glow(250,430,300,265,.1+.22*fl);g.globalCompositeOperation='source-over';g.globalAlpha=pa;
  /* arcs above the sentence */
  if(q>=0){const aa=detail?ease((E-5.0)/.6):ease(sinceQ/.18),a0=detail&&E<5.0?0:aa;
   g.globalCompositeOperation='lighter';
   for(let j=0;j<NT;j++){const w=AT[q][j];if(j===q||w<.03)continue;const x1=tx(q),x2=tx(j),h=Math.min(40,8+Math.abs(q-j)*7),mx=(x1+x2)/2;
    g.strokeStyle=`hsla(${TH[j]},95%,68%,${(.25+.75*w)*a0*pa})`;g.lineWidth=(1+w*9);g.lineCap='round';g.beginPath();g.moveTo(x1,TY);g.quadraticCurveTo(mx,TY-h*2,x2,TY);g.stroke();
    for(let p=0;p<2;p++){const u=(E*.9+p*.5+j*.13)%1,m=1-u,px=m*m*x1+2*m*u*mx+u*u*x2,py=m*m*TY+2*m*u*(TY-h*2)+u*u*TY;glow(px,py,5+w*14,TH[j],.85*a0*pa)}}
   g.globalCompositeOperation='source-over'}
  /* token tiles (these are also the column headers) */
  for(let j=0;j<NT;j++){const ta=ease((E-S.on-j*.06)/.35),x=X0+j*PIT,wgt=q>=0?(AT[q][j]*(detail?(E>5.0?1:0):1)):0,isq=q===j;
   g.globalAlpha=pa*ta;g.globalCompositeOperation='lighter';glow(x+PIT/2-2,TY+17,34,TH[j],.12+.8*wgt+(isq?.5:0));g.globalCompositeOperation='source-over';
   g.fillStyle=`hsla(${TH[j]},70%,48%,${.22+.4*wgt})`;rr(x,TY,PIT-4,34,7);g.fill();g.strokeStyle=isq?'rgba(255,255,255,.98)':`hsla(${TH[j]},92%,68%,${.75+.25*wgt})`;g.lineWidth=isq?2.2:1.2;g.stroke();
   g.fillStyle='#fff';g.font=`800 9.5px ${MONO}`;g.textAlign='center';g.fillText(T[j],x+PIT/2-2,TY+21)}
  g.globalAlpha=pa;
  /* heatmap */
  for(let i=0;i<NT;i++){const ra=ease((E-S.on-.3-i*.04)/.3),y=HY+i*RH,cur=q===i;
   g.globalAlpha=pa*ra;g.fillStyle=cur?'#fff':`hsla(${TH[i]},80%,76%,.9)`;g.font=`800 9px ${MONO}`;g.textAlign='right';g.fillText(T[i],X0-8,y+RH/2+3);
   for(let j=0;j<NT;j++){const x=X0+j*PIT,rt=S.rowT[i],v=AT[i][j],fa=rt>0?ease((E-rt-j*.04)/.22):0,rawMode=detail&&i===5&&E>=3.7&&E<5.0;
    g.fillStyle='rgba(120,150,230,.07)';rr(x,y+1,PIT-4,RH-3,4);g.fill();
    if(fa>0){const h=250+v*110,lt=26+v*46,al=(.2+.8*Math.sqrt(v))*fa;g.fillStyle=`hsla(${h},85%,${lt}%,${al})`;rr(x,y+1,PIT-4,RH-3,4);g.fill();
     if(v>.18){g.globalCompositeOperation='lighter';glow(x+PIT/2-2,y+RH/2,PIT*.8,h,.5*fa*v);g.globalCompositeOperation='source-over'}
     g.fillStyle=`rgba(255,255,255,${fa*(.45+.55*v)})`;g.font=`800 8.5px ${MONO}`;g.textAlign='center';g.fillText(Math.round(v*100)+'%',x+PIT/2-2,y+RH/2+3)}
    else if(i===5&&detail&&E>=3.7){const sa=ease((E-3.7-j*.1)/.25),sv=SC[5][j];g.fillStyle=`rgba(103,232,249,${.85*sa})`;g.font=`800 8.5px ${MONO}`;g.textAlign='center';g.fillText(sv.toFixed(1),x+PIT/2-2,y+RH/2+3);
     g.strokeStyle=`rgba(103,232,249,${.5*sa})`;g.lineWidth=1;rr(x,y+1,PIT-4,RH-3,4);g.stroke()}
    if(cur){g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1;rr(x,y+1,PIT-4,RH-3,4);g.stroke()}}
   g.globalAlpha=pa}
  /* donut + top keys for the current query */
  const qq=q>=0?q:5,dA=q>=0?(detail?ease((E-5.9)/.5):ease(sinceQ/.35)):1,cx=130,cy=632,R0=36,R1=52;
  g.globalAlpha=pa*dA;let ang=-Math.PI/2;const ws=AT[qq];
  for(let j=0;j<NT;j++){const sw=ws[j]*Math.PI*2*(q<0?1:1);g.fillStyle=`hsla(${TH[j]},85%,60%,.9)`;g.beginPath();g.arc(cx,cy,R1,ang,ang+sw);g.arc(cx,cy,R0,ang+sw,ang,true);g.closePath();g.fill();ang+=sw}
  g.globalCompositeOperation='lighter';glow(cx,cy,70,TH[qq],.18*dA);g.globalCompositeOperation='source-over';
  g.fillStyle='#fff';g.font=`800 11px ${MONO}`;g.textAlign='center';g.fillText(T[qq],cx,cy+4);
  const top=[...ws.keys()].sort((a,b)=>ws[b]-ws[a]).slice(0,3);
  g.textAlign='left';g.fillStyle='rgba(150,170,210,.9)';g.font=`700 8.5px ${MONO}`;g.fillText('"'+T[qq]+'" LOOKS AT',210,596);
  top.forEach((j,r)=>{const y=618+r*24;g.fillStyle=`hsla(${TH[j]},90%,65%,1)`;g.beginPath();g.arc(218,y-3,4.5,0,7);g.fill();g.fillStyle='#fff';g.font=`800 13px ${MONO}`;g.fillText(T[j],232,y);g.textAlign='right';g.fillStyle=`hsla(${TH[j]},95%,76%,1)`;g.fillText(Math.round(ws[j]*100)+'%',452,y);g.textAlign='left'});
  g.globalAlpha=1;
  if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.08*fl})`;g.fillRect(0,0,540,960)}}
 g.globalCompositeOperation='source-over';g.globalAlpha=1;
 const sa2=ease((E-3.0)/.4)*(1-ease((E-12.2)/.3));
 if(sa2>.01){const qq=q>=0?q:(S.rowT[5]>0?5:-1);if(qq>=0){const ws=AT[qq],mj=ws.indexOf(Math.max(...ws.filter((_,j)=>j!==qq)));
  const mx=[...ws.keys()].filter(j=>j!==qq).sort((a,b)=>ws[b]-ws[a])[0];stat(36,'QUERY',T[qq],TH[qq],sa2,'left');stat(250,'LOOKS MOST AT',T[mx],TH[mx],sa2,'center');stat(460,'WEIGHT',Math.round(ws[mx]*100)+'%',140,sa2,'right')}}
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');   /* hint: tap once to enable sound */
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);   /* starts by itself, so the first frame is the beginning */
})();
