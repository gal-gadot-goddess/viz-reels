(()=>{

 for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}

 musBus.connect(master);const s=ac.createGain();s.gain.value=.35;musBus.connect(s);s.connect(rev)}

 node.connect(o.bus||sfxBus);if(o.wet!==0){const w=ac.createGain();w.gain.value=o.wet==null?.25:o.wet;node.connect(w);w.connect(rev)}}
function tone(o={}){if(!ac||muted)return;const{type='sine',f=440,f2=null,dur=.12,vol=.15,at=0,atk=.008}=o,t0=o.abs!=null?o.abs:TN()+at;

 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+atk);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 osc.connect(gn);out(gn,o);osc.start(t0);osc.stop(t0+dur+.06)}
function noise(o={}){if(!ac||muted)return;const{dur=.4,vol=.2,at=0,f0=400,f1=2000,q=1.2,ft='bandpass'}=o,t0=o.abs!=null?o.abs:TN()+at;
 const len=Math.max(1,(dur+.05)*ac.sampleRate|0),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const n=ac.createBufferSource();n.buffer=buf;const f=ac.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+dur*.2);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 n.connect(f);f.connect(gn);out(gn,o);n.start(t0);n.stop(t0+dur+.05)}

 ui(){tone({f:640,dur:.05,vol:.05,wet:.1})},

 emitL(n){tone({f:NOTES[n-1],dur:.16,vol:.07,pan:-.5})},
 emitR(){tone({type:'square',f:1700,dur:.03,vol:.022,pan:.5,wet:0})},
 arrL(n){tone({f:NOTES[n-1]*2,f2:NOTES[n-1]*2.02,dur:.2,vol:.08,pan:-.5})},

 warn(){tone({type:'triangle',f:330,dur:.14,vol:.1,pan:-.4});tone({type:'triangle',f:262,dur:.22,vol:.1,at:.14,pan:-.4})},
 chord(v=.07){[261.6,329.6,392,523.2,659.3].forEach((f,i)=>tone({type:'triangle',f,dur:1.5,vol:v,at:i*.035,wet:.4}));tone({f:130,f2:60,dur:.6,vol:.28,wet:.1})},

 const CH=[[220,261.6,329.6,110],[174.6,220,261.6,87.3],[261.6,329.6,392,130.8],[196,246.9,293.7,98]];

   const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+3);
   const gn=ac.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.013,t+1.2);gn.gain.linearRampToValueAtTime(.0001,t+4.3);
   o.connect(lp);lp.connect(gn);gn.connect(musBus);o.start(t);o.stop(t+4.4)}));
  for(let b=0;b<2;b++)tone({abs:t+b*2,f:c[3],dur:1.9,vol:.1,atk:.04,bus:musBus,wet:0})});
 const AR=[440,523.25,659.25,784,659.25,523.25,440,392];
 for(let i=0;i<40;i++){const t=t0+3+i*.25,v=.02+.03*clamp(i/20,0,1);if(t>t0+11.6)break;
  tone({abs:t,type:'triangle',f:AR[i%8]*(i%16>=8?2:1),dur:.3,vol:v,bus:musBus,pan:Math.sin(i)*.4,wet:.35})}
 for(let b=0;b<17;b++){const t=t0+3+b*B;tone({abs:t,f:135,f2:42,dur:.22,vol:.2,bus:musBus,wet:0});
  noise({abs:t+B/2,dur:.05,vol:.018,f0:9000,f1:7000,q:.8,ft:'highpass',bus:musBus,wet:0})}
 noise({abs:t0+11.7,dur:.85,vol:.16,f0:300,f1:7000,q:1.5,bus:musBus});
 tone({abs:t0+11.7,type:'sawtooth',f:200,f2:1600,dur:.85,vol:.04,bus:musBus})}

/* ================= scene state ================= */

 r.addColorStop(0,`hsla(${k},100%,88%,1)`);r.addColorStop(.25,`hsla(${k},100%,64%,.55)`);r.addColorStop(1,`hsla(${k},100%,50%,0)`);x.fillStyle=r;x.fillRect(0,0,64,64);SPR[k]=c}return SPR[k]}

function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');
 $('#stL').classList.remove('show');$('#stR').classList.remove('show');['L','R'].forEach(s=>{$('#n'+s).textContent='100%';$('#r'+s).textContent='UPTIME · 0 FAILED'});fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawHost(s){const x=HX[s],fa=ease((E-S.hostOn)/.6)*(S.hostOn>0?1:0);if(fa<=0)return;const L=LANE[s],dead=s==='L'&&S.allDown,fl=Math.exp(-(E-S.flash[s])*3);
 g.globalAlpha=fa;g.fillStyle='rgba(12,18,34,.92)';rr(x-6,Y0,162,Y1-Y0,12);g.fill();g.strokeStyle=`rgba(${dead?'255,90,80':L.rgb},${.5+.3*(dead?Math.sin(E*8):0)})`;g.lineWidth=1.6;g.stroke();
 g.fillStyle=`rgba(${dead?'255,120,110':L.rgb},.95)`;g.font=`700 11px ${MONO}`;g.textAlign='center';g.fillText(s==='L'?'MONOLITH':'MICROSERVICES',x+75,Y0+19);
 if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.22*fl*fa})`;rr(x-6,Y0,162,Y1-Y0,12);g.fill();g.globalCompositeOperation='source-over'}
 g.globalAlpha=1}
function drawLinks(){
 const fa=ease((E-S.hostOn-.4)/.6)*(S.hostOn>0?1:0);if(fa<=0)return;
 g.globalAlpha=fa;const dead=!!S.allDown;g.strokeStyle=`rgba(${dead?'255,90,80':'177,140,255'},.6)`;g.lineWidth=1.6;rr(68,290,134+4,250+2,6);g.stroke();
 const gx=377,gy=292;g.fillStyle='rgba(55,224,176,.14)';rr(gx-58,gy-9,116,18,9);g.fill();g.strokeStyle='rgba(55,224,176,.8)';g.lineWidth=1.2;g.stroke();
 g.fillStyle='rgba(230,245,240,.9)';g.font=`700 8.5px ${MONO}`;g.textAlign='center';g.fillText('API GATEWAY',gx,gy+3);
 for(let i=0;i<6;i++){const c=cen('R',i),dn=S.m.R[i].st!=='up';g.setLineDash(dn?[3,5]:[2,6]);g.lineDashOffset=-E*20;g.strokeStyle=dn?'rgba(255,90,80,.7)':'rgba(55,224,176,.55)';g.lineWidth=1.2;g.beginPath();g.moveTo(gx+(c[0]-gx)*.35,gy+9);g.lineTo(c[0],c[1]-31);g.stroke()}
 g.setLineDash([]);g.globalAlpha=1}
function drawMods(s){const L=LANE[s];S.m[s].forEach((m,i)=>{const [x,y]=cen(s,i),a=ease((E-m.app)/.35)*(m.app>0?1:0);if(a<=0)return;
 const w=s==='L'?64:54,h=s==='L'?80:62,down=m.st==='down',boot=m.st==='boot',pl=Math.exp(-(E-(S.pulse[s][i]||-9))*5),jit=down&&E-m.t<.6?Math.sin(E*70)*3*(1-(E-m.t)/.6):0;
 const rgb=down?'255,90,80':boot?'255,190,80':L.rgb,hue=down?0:boot?40:L.h;
 g.globalAlpha=a;g.globalCompositeOperation='lighter';glow(x,y,46,hue,(down?.35+.15*Math.sin(E*9+i):.12+.5*pl));g.globalCompositeOperation='source-over';
 g.fillStyle=`rgba(${rgb},${down?.28:.12+.16*pl})`;rr(x-w/2+jit,y-h/2,w,h,s==='L'?4:10);g.fill();
 g.strokeStyle=`rgba(${rgb},.9)`;g.lineWidth=1.5;if(boot)g.setLineDash([4,3]);g.stroke();g.setLineDash([]);
 g.fillStyle='rgba(240,245,255,.95)';g.font=`700 ${s==='L'?9:8.5}px ${MONO}`;g.textAlign='center';g.fillText(NAMES[i],x+jit,y-4);
 g.font='800 15px sans-serif';g.fillText(down?'✕':boot?'↻':'✓',x+jit,y+16);
 if(boot){const p=clamp((E-m.t)/1,0,1);g.strokeStyle='rgba(255,200,90,.95)';g.lineWidth=2.5;g.beginPath();g.arc(x,y,24,-1.57,-1.57+6.28*p);g.stroke()}
 g.globalAlpha=1})}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 for(const p of S.pk.slice()){if((E-p.t0)/p.dur>=1){S.pk.splice(S.pk.indexOf(p),1);arrive(p)}}
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 drawHost('L');drawHost('R');drawLinks();drawMods('L');drawMods('R');
 if(S.allDown){const k=ease((E-S.allDown)/.4);g.fillStyle=`rgba(120,10,10,${.38*k})`;rr(68,290,138,252,6);g.fill();g.fillStyle=`rgba(255,110,100,${(.6+.4*Math.sin(E*10))*k})`;g.font=`800 26px ${MONO}`;g.textAlign='center';g.fillText('DOWN',137,422)}
 g.globalCompositeOperation='lighter';
 for(const p of S.pk){const u=ease((E-p.t0)/p.dur),c=cen(p.s,p.i),h=LANE[p.s].h,x=lerp(p.fx,c[0],u),y=lerp(TOPC[p.s][1],c[1],u);
  for(let k=4;k>=1;k--){const v=clamp(u-k*.06,0,1);glow(lerp(p.fx,c[0],v),lerp(TOPC[p.s][1],c[1],v),7+k,h,.1*(5-k))}
  glow(x,y,16,h,.8);g.fillStyle=`hsl(${h},95%,85%)`;g.beginPath();g.arc(x,y,3,0,7);g.fill()}
 if(E-S.bug<.45){const k=1-(E-S.bug)/.45;['L','R'].forEach(s=>{const c=cen(s,3);g.strokeStyle=`rgba(255,110,100,${k})`;g.lineWidth=2.4;g.beginPath();g.moveTo(c[0],250);
  const n=7,seed=Math.floor(E*35);for(let j=1;j<=n;j++){const t=j/n;g.lineTo(c[0]+(j<n?(R(seed,j,s==='L'?1:2)-.5)*26:0),lerp(250,c[1],t))}g.stroke();glow(c[0],c[1],60,0,k*.7)})}
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=100*dt;glow(s.x,s.y,6,s.h,a)}
 S.rg=S.rg.filter(r=>E-r.t<.65);for(const r of S.rg){const a=(E-r.t)/.65;g.strokeStyle=`hsla(${r.h},100%,72%,${1-a})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,6+a*34,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}
