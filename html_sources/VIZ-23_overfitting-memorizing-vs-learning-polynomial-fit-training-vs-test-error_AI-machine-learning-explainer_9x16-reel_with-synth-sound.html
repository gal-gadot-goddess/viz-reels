 musBus.connect(master);const s=ac.createGain();s.gain.value=.35;musBus.connect(s);s.connect(rev)}

 node.connect(o.bus||sfxBus);if(o.wet!==0){const w=ac.createGain();w.gain.value=o.wet==null?.25:o.wet;node.connect(w);w.connect(rev)}}

 osc.connect(gn);out(gn,o);osc.start(t0);osc.stop(t0+dur+.06)}
function noise(o={}){if(!ac||muted)return;const{dur=.4,vol=.2,at=0,f0=400,f1=2000,q=1.2,ft='bandpass'}=o,t0=o.abs!=null?o.abs:TN()+at;
 const len=Math.max(1,(dur+.05)*ac.sampleRate|0),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const n=ac.createBufferSource();n.buffer=buf;const f=ac.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+dur*.2);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 n.connect(f);f.connect(gn);out(gn,o);n.start(t0);n.stop(t0+dur+.05)}
const sfx={
 ui(){tone({f:640,dur:.05,vol:.05,wet:.1})},
 thump(){tone({f:130,f2:38,dur:.45,vol:.6,wet:.1});tone({type:'triangle',f:520,f2:70,dur:.12,vol:.1})},

 emitR(){tone({type:'square',f:1700,dur:.03,vol:.022,pan:.5,wet:0})},

   o.connect(lp);lp.connect(gn);gn.connect(musBus);o.start(t);o.stop(t+4.4)}));

 for(let i=0;i<40;i++){const t=t0+3+i*.25,v=.02+.03*clamp(i/20,0,1);if(t>t0+11.6)break;
  tone({abs:t,type:'triangle',f:AR[i%8]*(i%16>=8?2:1),dur:.3,vol:v,bus:musBus,pan:Math.sin(i)*.4,wet:.35})}
 for(let b=0;b<17;b++){const t=t0+3+b*B;tone({abs:t,f:135,f2:42,dur:.22,vol:.2,bus:musBus,wet:0});

 tone({abs:t0+11.7,type:'sawtooth',f:200,f2:1600,dur:.85,vol:.04,bus:musBus})}

 start(){tone({type:'sawtooth',f:90,f2:700,dur:.8,vol:.07});noise({dur:.7,vol:.07,f0:300,f1:5000});tone({f:130,f2:40,dur:.4,vol:.3,wet:.1})}
});
const MONO='"JetBrains Mono",ui-monospace,monospace',PX=36,PY=262,PW=424,PH=298,CHY=574,CHH=116,KMAX=14,NS=161;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function fitPoly(pts,K){const n=K+1,A=Array.from({length:n},()=>new Array(n+1).fill(0));pts.forEach(([x,y])=>{const p=leg(x,K);for(let i=0;i<n;i++){for(let j=0;j<n;j++)A[i][j]+=p[i]*p[j];A[i][n]+=p[i]*y}});for(let i=0;i<n;i++)A[i][i]+=1e-7;
 for(let i=0;i<n;i++){let m=i;for(let k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[m][i]))m=k;[A[i],A[m]]=[A[m],A[i]];for(let k=i+1;k<n;k++){const q=A[k][i]/A[i][i];for(let j=i;j<=n;j++)A[k][j]-=q*A[i][j]}}
 const w=new Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=A[i][n];for(let j=i+1;j<n;j++)s-=A[i][j]*w[j];w[i]=s/A[i][i]}return w}

const FITS=[null],TRE=[null],TEE=[null],CURVES=[null];
for(let K=1;K<=KMAX;K++){const w=fitPoly(DATA.tr,K);FITS.push(w);TRE.push(mseP(w,DATA.tr));TEE.push(mseP(w,DATA.te));CURVES.push(Array.from({length:NS},(_,i)=>evP(w,-1+2*i/(NS-1))))}
const BEST=TEE.indexOf(Math.min(...TEE.slice(1)));
const TD=[0,3.5,4.1,4.7,5.2,5.65,6.05,6.4,6.75,7.1,7.45,7.8,8.15,8.5,8.85];
const sxp=x=>PX+(x+1)/2*PW,syp=y=>PY+(1.7-y)/3.4*PH,lg=v=>Math.log10(Math.max(v,.008));
const cxp=k=>PX+14+(k-1)/(KMAX-1)*(PW-28),cyp=v=>CHY+CHH-10-clamp((lg(v)+2.1)/3.1,0,1)*(CHH-26);
const SPR={};function spr(h){const k=Math.round(h/10)*10;if(!SPR[k]){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,`hsla(${k},100%,88%,1)`);r.addColorStop(.25,`hsla(${k},100%,64%,.55)`);r.addColorStop(1,`hsla(${k},100%,50%,0)`);x.fillStyle=r;x.fillRect(0,0,64,64);SPR[k]=c}return SPR[k]}
function glow(x,y,r,h,a){if(a<.01)return;g.globalAlpha=Math.min(1,a);g.drawImage(spr(h),x-r,y-r,2*r,2*r);g.globalAlpha=1}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
let S,E=0,events=[],gen=0,raf=null,lastF=0;
function fresh(){S={on:0,testT:-9,dsel:0,flash:-9,bestT:-9,sp:[]}}
function at(t,fn){events.push({t,fn});events.sort((a,b)=>a.t-b.t)}
function flt(txt,x,y,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;fx.appendChild(d);setTimeout(()=>d.remove(),1950)}
window.__of=()=>({best:BEST,tr:TRE.slice(1).map(v=>+v.toFixed(3)),te:TEE.slice(1).map(v=>+v.toFixed(3))});

/* ================= timeline ================= */
function buildTimeline(){
 const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.6,.12);for(let k=0;k<18;k++)at(E+.6+k*.035,()=>sfx.reveal(k))});
 a(2.7,()=>flt('18 noisy dots. fit a curve through them.',250,242,'#e9eff8'));
 for(let k=1;k<=KMAX;k++)a(TD[k],()=>{S.dsel=k;sfx.deg(k,TEE[k])});
 a(3.5,()=>{sfx.start();flt('degree 1: too simple. it underfits.',250,242,'#67e8f9')});
 a(4.0,()=>{S.testT=E;for(let k=0;k<20;k++)at(E+k*.03,()=>sfx.reveal(k+4));flt('amber = new data it never saw',250,242,'#ffb454')});
 a(4.75,()=>flt('degree 3: just right',250,242,'#6ee7b7'));
 a(6.1,()=>flt('more complexity…',250,242,'#e9eff8'));
 a(7.1,()=>{sfx.warn();flt('now it memorizes the noise',250,242,'#ff8a70')});
 a(8.9,()=>{S.flash=E;flt('degree 14: perfect on training, awful on new data',250,242,'#ff8a70')});
 a(9.8,()=>{S.bestT=E;S.dsel=BEST;sfx.sweet();flt(`best on new data: degree ${BEST}`,250,242,'#6ee7b7')});
 a(10.8,()=>flt('more complexity ≠ smarter',250,242,'#e9eff8'));
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact();S.flash=E});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function stat(x,label,val,hue,al,align){g.textAlign=align;g.fillStyle=`rgba(150,170,210,${.85*al})`;g.font=`700 9px ${MONO}`;g.fillText(label,x,706);
 g.fillStyle=`hsla(${hue},95%,72%,${al})`;g.font='800 28px "Outfit",system-ui,sans-serif';g.fillText(val,x,736)}
const fmt=v=>v>=1?v.toFixed(2):v.toFixed(3);
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const pa=ease((E-S.on)/.8)*(S.on>0?1:0),fl=Math.exp(-(E-S.flash)*2.5);
 /* current (blended) degree */
 let d=S.dsel,prev=Math.max(1,d-1),u=d>0?ease((E-(S.bestT>0?S.bestT:TD[Math.max(1,d)]))/.3):1;
 const best=S.bestT>0;if(best&&d===BEST)prev=KMAX;
 const dd=d<1?0:d,te=dd?lerp(TEE[prev],TEE[dd],u):0,tre=dd?lerp(TRE[prev],TRE[dd],u):0;
 const over=clamp(Math.log10(Math.max(te,.001)/.07)/1.6,0,1),hue=190-190*over;
 if(pa>0){g.globalAlpha=pa;g.globalCompositeOperation='lighter';glow(250,420,300,over>.5?10:200,.1+.2*fl);g.globalCompositeOperation='source-over';
  /* plot panel */
  g.fillStyle='rgba(6,10,24,.88)';rr(PX,PY,PW,PH,16);g.fill();g.save();rr(PX,PY,PW,PH,16);g.clip();
  g.strokeStyle='rgba(120,150,230,.08)';g.lineWidth=1;for(let i=1;i<8;i++){g.beginPath();g.moveTo(PX+i*PW/8,PY);g.lineTo(PX+i*PW/8,PY+PH);g.stroke()}for(let i=1;i<6;i++){g.beginPath();g.moveTo(PX,PY+i*PH/6);g.lineTo(PX+PW,PY+i*PH/6);g.stroke()}
  /* true curve (faint) */
  g.setLineDash([4,5]);g.strokeStyle='rgba(180,200,240,.28)';g.lineWidth=1.4;g.beginPath();for(let i=0;i<NS;i++){const x=-1+2*i/(NS-1),X=sxp(x),Y=syp(TRUEF(x));i?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();g.setLineDash([]);
  /* fitted curve */
  if(dd>0){const cur=CURVES[dd],old=CURVES[prev],ys=cur.map((v,i)=>lerp(old[i],v,u));
   if(S.testT>0){const ta=ease((E-S.testT)/.5);DATA.te.filter((_,i)=>i%10===3).forEach(([x,y],i)=>{const idx=Math.round((x+1)/2*(NS-1)),yc=ys[idx],X=sxp(x),Y=syp(y);if(Math.abs(Y-syp(yc))>3){g.strokeStyle=`rgba(255,180,84,${.3*ta})`;g.lineWidth=1;g.beginPath();g.moveTo(X,Y);g.lineTo(X,clamp(syp(yc),PY,PY+PH));g.stroke()}})}
   g.globalCompositeOperation='lighter';for(let pass=0;pass<2;pass++){g.strokeStyle=`hsla(${hue},95%,${pass?72:55}%,${pass?.98:.28})`;g.lineWidth=pass?2.6:9;g.lineJoin='round';g.beginPath();ys.forEach((v,i)=>{const X=sxp(-1+2*i/(NS-1)),Y=clamp(syp(v),PY-30,PY+PH+30);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()}g.globalCompositeOperation='source-over'}
  /* training points */
  DATA.tr.forEach(([x,y],i)=>{const ta=ease((E-S.on-.6-i*.035)/.3);if(ta<=0)return;const X=sxp(x),Y=syp(y);g.globalCompositeOperation='lighter';glow(X,Y,10,190,.8*ta);g.globalCompositeOperation='source-over';g.fillStyle=`rgba(255,255,255,${ta})`;g.beginPath();g.arc(X,Y,3,0,7);g.fill()});
  /* test points */
  if(S.testT>0)DATA.te.filter((_,i)=>i%10===3).forEach(([x,y],i)=>{const ta=ease((E-S.testT-i*.03)/.3);if(ta<=0)return;const X=sxp(x),Y=syp(y);g.strokeStyle=`rgba(255,190,90,${ta})`;g.lineWidth=1.8;g.beginPath();g.arc(X,Y,4.3,0,7);g.stroke();g.globalCompositeOperation='lighter';glow(X,Y,9,45,.35*ta);g.globalCompositeOperation='source-over'});
  g.restore();g.strokeStyle='rgba(103,232,249,.55)';g.lineWidth=1.5;rr(PX,PY,PW,PH,16);g.stroke();
  g.fillStyle='rgba(150,170,210,.9)';g.font=`700 8.5px ${MONO}`;g.textAlign='left';g.fillText('MODEL FIT',PX+12,PY+16);
  g.fillStyle='rgba(103,232,249,.95)';g.beginPath();g.arc(PX+PW-130,PY+13,3,0,7);g.fill();g.fillStyle='rgba(200,215,240,.9)';g.fillText('training',PX+PW-122,PY+16);
  g.strokeStyle='rgba(255,190,90,.95)';g.lineWidth=1.6;g.beginPath();g.arc(PX+PW-62,PY+13,3.6,0,7);g.stroke();g.fillText('new data',PX+PW-54,PY+16);
  /* error chart */
  g.fillStyle='rgba(6,10,24,.88)';rr(PX,CHY,PW,CHH,14);g.fill();g.strokeStyle='rgba(255,180,84,.45)';g.lineWidth=1.4;g.stroke();
  g.fillStyle='rgba(150,170,210,.9)';g.font=`700 8.5px ${MONO}`;g.fillText('ERROR vs MODEL COMPLEXITY (degree 1 → 14)',PX+12,CHY+15);
  g.strokeStyle='rgba(120,150,230,.12)';g.lineWidth=1;[0,1,2].forEach(i=>{const y=CHY+CHH-10-(i/3)*(CHH-26);g.beginPath();g.moveTo(PX+10,y);g.lineTo(PX+PW-10,y);g.stroke()});
  const reach=d>0?d:0;
  for(const [arr,col,rgb] of [[TRE,190,'103,232,249'],[TEE,45,'255,190,90']]){g.globalCompositeOperation='lighter';g.strokeStyle=`rgba(${rgb},.95)`;g.lineWidth=2.2;g.beginPath();let on=false;for(let k=1;k<=Math.min(KMAX,reach);k++){const X=cxp(k),Y=cyp(arr[k]);on?g.lineTo(X,Y):g.moveTo(X,Y);on=true}g.stroke();
   for(let k=1;k<=Math.min(KMAX,reach);k++)glow(cxp(k),cyp(arr[k]),6,col,.8);g.globalCompositeOperation='source-over'}
  if(S.bestT>0){const bx=cxp(BEST),by=cyp(TEE[BEST]),ba=ease((E-S.bestT)/.4);g.strokeStyle=`rgba(110,240,170,${ba})`;g.lineWidth=1.6;g.setLineDash([3,3]);g.beginPath();g.moveTo(bx,CHY+22);g.lineTo(bx,CHY+CHH-6);g.stroke();g.setLineDash([]);
   g.fillStyle=`rgba(110,240,170,${ba})`;g.font=`800 9px ${MONO}`;g.textAlign='center';g.fillText('SWEET SPOT',bx+4,CHY+30);g.beginPath();g.arc(bx,by,4.5,0,7);g.fill()}
  g.textAlign='center';g.fillStyle='rgba(150,170,210,.75)';g.font=`700 8px ${MONO}`;[1,4,8,14].forEach(k=>g.fillText(k,cxp(k),CHY+CHH-1));
  if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.06*fl})`;g.fillRect(0,0,540,960);g.globalCompositeOperation='source-over'}
  g.globalAlpha=1}
 const sa=ease((E-3.2)/.4)*(1-ease((E-12.2)/.3));
 if(sa>.01){stat(36,'DEGREE',dd?String(dd):'—',190,sa,'left');stat(250,'TRAINING ERROR',dd?fmt(tre):'—',190,sa,'center');stat(460,'ERROR ON NEW DATA',dd?fmt(te):'—',lerp(45,5,over),sa,'right')}
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');   /* hint: tap once to enable sound */
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);   /* starts by itself, so the first frame is the beginning */
})();
