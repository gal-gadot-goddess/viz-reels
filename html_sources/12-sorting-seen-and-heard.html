.a1{background:#3d6bff;top:-170px;left:-130px;animation:drift 16s ease-in-out infinite alternate}
.a2{background:#7c3aed;bottom:-150px;right:-130px;animation:drift 19s ease-in-out infinite alternate-reverse}

#grain{position:absolute;inset:0;z-index:40;opacity:.06;pointer-events:none;mix-blend-mode:overlay}

#apiL{left:65px;border-color:#5aa2ff;box-shadow:0 0 18px rgba(90,162,255,.28),inset 0 0 14px rgba(90,162,255,.08)}

.cnt .st.show{opacity:1}

#stL{color:#5aa2ff;border:1.3px solid rgba(90,162,255,.6);background:rgba(90,162,255,.07)}
#stR{color:#37e0b0;border:1.3px solid rgba(55,224,176,.6);background:rgba(55,224,176,.07)}

#stL{color:#ff8a50;border:1.3px solid rgba(255,138,80,.6);background:rgba(255,138,80,.07)}
#stR{color:#37e0b0;border:1.3px solid rgba(55,224,176,.6);background:rgba(55,224,176,.07)}

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s),stage=$('#stage'),fx=$('#fx'),cv=$('#cv'),g=cv.getContext('2d');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,ease=x=>1-Math.pow(1-clamp(x,0,1),3);
const R=(a,b,c)=>{const x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x)};
const NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,784,880,1046.5,1174.66];
const QS=new URLSearchParams(location.search);
let sc=1;function fit(){sc=Math.min(innerWidth/540,innerHeight/960);stage.style.transform=`scale(${sc})`}
addEventListener('resize',fit);fit();

/* ================= AUDIO: 100% synthesized, no files ================= */
let ac=null,master,sfxBus,musBus,rev,muted=false,musicOn=QS.get('music')!=='0',A0=0,start=0,playing=false;
function audioInit(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 ac=new AC();master=ac.createGain();master.gain.value=.62;
 const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=6;master.connect(comp);comp.connect(ac.destination);
 sfxBus=ac.createGain();sfxBus.connect(master);
 rev=ac.createConvolver();const n=ac.sampleRate*1.7|0,b=ac.createBuffer(2,n,ac.sampleRate);
 for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}
 rev.buffer=b;const rg=ac.createGain();rg.gain.value=.3;rev.connect(rg);rg.connect(master);newBus()}
function newBus(){if(musBus)musBus.gain.setTargetAtTime(0,ac.currentTime,.05);musBus=ac.createGain();musBus.gain.value=.7;
 musBus.connect(master);const s=ac.createGain();s.gain.value=.35;musBus.connect(s);s.connect(rev)}
const TN=()=>ac?Math.max(ac.currentTime,A0+(performance.now()-start)/1000):0;
function out(node,o){const p=ac.createStereoPanner?ac.createStereoPanner():null;if(p){p.pan.value=o.pan||0;node.connect(p);node=p}
 node.connect(o.bus||sfxBus);if(o.wet!==0){const w=ac.createGain();w.gain.value=o.wet==null?.25:o.wet;node.connect(w);w.connect(rev)}}
function tone(o={}){if(!ac||muted)return;const{type='sine',f=440,f2=null,dur=.12,vol=.15,at=0,atk=.008}=o,t0=o.abs!=null?o.abs:TN()+at;
 const osc=ac.createOscillator();osc.type=type;osc.frequency.setValueAtTime(f,t0);if(f2)osc.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+atk);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 osc.connect(gn);out(gn,o);osc.start(t0);osc.stop(t0+dur+.06)}
function noise(o={}){if(!ac||muted)return;const{dur=.4,vol=.2,at=0,f0=400,f1=2000,q=1.2,ft='bandpass'}=o,t0=o.abs!=null?o.abs:TN()+at;
 const len=Math.max(1,(dur+.05)*ac.sampleRate|0),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const n=ac.createBufferSource();n.buffer=buf;const f=ac.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
 const gn=ac.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+dur*.2);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 n.connect(f);f.connect(gn);out(gn,o);n.start(t0);n.stop(t0+dur+.05)}
const sfx={
 ui(){tone({f:640,dur:.05,vol:.05,wet:.1})},
 thump(){tone({f:130,f2:38,dur:.45,vol:.6,wet:.1});tone({type:'triangle',f:520,f2:70,dur:.12,vol:.1})},
 zap(){tone({type:'sawtooth',f:2100,f2:160,dur:.2,vol:.14});noise({dur:.14,vol:.05,f0:3000,f1:600})},
 whoosh(d=.5,v=.12,rv=false){noise({dur:d,vol:v,f0:rv?2600:300,f1:rv?350:2600})},
 emitL(n){tone({f:NOTES[n-1],dur:.16,vol:.07,pan:-.5})},
 emitR(){tone({type:'square',f:1700,dur:.03,vol:.022,pan:.5,wet:0})},
 arrL(n){tone({f:NOTES[n-1]*2,f2:NOTES[n-1]*2.02,dur:.2,vol:.08,pan:-.5})},
 arrR(n){tone({type:'triangle',f:NOTES[n-1]*2,dur:.07,vol:.07,pan:.5,wet:.1})},
 ack(){tone({f:1760,f2:2200,dur:.09,vol:.04,pan:-.2})},
 crack(pan=.5){noise({dur:.2,vol:.16,f0:5000,f1:400,q:.8,pan});tone({type:'sawtooth',f:900,f2:90,dur:.16,vol:.1,pan})},
 glitch(){for(let i=0;i<7;i++)tone({type:'square',f:300+R(i,1,1)*1800,dur:.045,vol:.07,at:i*.05,pan:.5,wet:0});noise({dur:.4,vol:.1,f0:6000,f1:300,at:.1,pan:.5})},
 warn(){tone({type:'triangle',f:330,dur:.14,vol:.1,pan:-.4});tone({type:'triangle',f:262,dur:.22,vol:.1,at:.14,pan:-.4})},
 chord(v=.07){[261.6,329.6,392,523.2,659.3].forEach((f,i)=>tone({type:'triangle',f,dur:1.5,vol:v,at:i*.035,wet:.4}));tone({f:130,f2:60,dur:.6,vol:.28,wet:.1})},
 impact(){tone({f:90,f2:28,dur:.9,vol:.7,wet:.1});noise({dur:.7,vol:.18,f0:2500,f1:80,q:.6});sfx.chord(.08)}
};
/* generative music bed, scheduled on the audio clock (120 bpm, A minor pentatonic) */
function music(){if(!ac||!musicOn)return;const t0=A0,B=.5;
 const CH=[[220,261.6,329.6,110],[174.6,220,261.6,87.3],[261.6,329.6,392,130.8],[196,246.9,293.7,98]];
 CH.forEach((c,i)=>{const t=t0+i*4;
  c.slice(0,3).forEach(f=>[-7,7].forEach(d=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;
   const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+3);
   const gn=ac.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.013,t+1.2);gn.gain.linearRampToValueAtTime(.0001,t+4.3);
   o.connect(lp);lp.connect(gn);gn.connect(musBus);o.start(t);o.stop(t+4.4)}));
  for(let b=0;b<2;b++)tone({abs:t+b*2,f:c[3],dur:1.9,vol:.1,atk:.04,bus:musBus,wet:0})});
 const AR=[440,523.25,659.25,784,659.25,523.25,440,392];
 for(let i=0;i<40;i++){const t=t0+3+i*.25,v=.02+.03*clamp(i/20,0,1);if(t>t0+11.6)break;
  tone({abs:t,type:'triangle',f:AR[i%8]*(i%16>=8?2:1),dur:.3,vol:v,bus:musBus,pan:Math.sin(i)*.4,wet:.35})}
 for(let b=0;b<17;b++){const t=t0+3+b*B;tone({abs:t,f:135,f2:42,dur:.22,vol:.2,bus:musBus,wet:0});
  noise({abs:t+B/2,dur:.05,vol:.018,f0:9000,f1:7000,q:.8,ft:'highpass',bus:musBus,wet:0})}
 noise({abs:t0+11.7,dur:.85,vol:.16,f0:300,f1:7000,q:1.5,bus:musBus});
 tone({abs:t0+11.7,type:'sawtooth',f:200,f2:1600,dur:.85,vol:.04,bus:musBus})}

/* ================= scene state: real sorting algorithms, running live ================= */
Object.assign(sfx,{
 note(v,p,vol){tone({type:'triangle',f:160*Math.pow(2,v/N*3),dur:.05,vol:vol||.035,pan:p,wet:.2})},
 sweep(k){tone({type:'sine',f:261.6*Math.pow(2,k/8),dur:.18,vol:.06,wet:.4})},
 start(){tone({type:'sawtooth',f:90,f2:700,dur:.8,vol:.07});noise({dur:.7,vol:.07,f0:300,f1:5000});tone({f:130,f2:40,dur:.4,vol:.3,wet:.1})},
 shuffle(){noise({dur:.5,vol:.12,f0:6000,f1:300,q:.8});for(let i=0;i<8;i++)tone({type:'square',f:200+R(i,1,1)*1600,dur:.04,vol:.04,at:i*.05,wet:0})}
});
const N=96,CX=250,CY=470,R0=64,MONO='"JetBrains Mono",ui-monospace,monospace';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function perm(seed){const r=mulberry(seed),a=Array.from({length:N},(_,i)=>i);for(let i=N-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function* bubble(a){for(let p=0;p<N-1;p++)for(let i=0;i<N-1-p;i++){yield{k:'c',i,j:i+1};if(a[i]>a[i+1]){[a[i],a[i+1]]=[a[i+1],a[i]];yield{k:'s',i,j:i+1}}}}
function* quick(a,lo=0,hi=N-1){if(lo>=hi)return;const pv=a[hi];let i=lo;for(let j=lo;j<hi;j++){yield{k:'c',i:j,j:hi};if(a[j]<pv){[a[i],a[j]]=[a[j],a[i]];yield{k:'s',i,j};i++}}[a[i],a[hi]]=[a[hi],a[i]];yield{k:'s',i,j:hi};yield*quick(a,lo,i-1);yield*quick(a,i+1,hi)}
const SPR={};function spr(h){const k=Math.round(h/10)*10;if(!SPR[k]){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,`hsla(${k},100%,88%,1)`);r.addColorStop(.25,`hsla(${k},100%,64%,.55)`);r.addColorStop(1,`hsla(${k},100%,50%,0)`);x.fillStyle=r;x.fillRect(0,0,64,64);SPR[k]=c}return SPR[k]}
function glow(x,y,r,h,a){if(a<.01)return;g.globalAlpha=Math.min(1,a);g.drawImage(spr(h),x-r,y-r,2*r,2*r);g.globalAlpha=1}
let S,E=0,events=[],gen=0,raf=null,lastF=0;
function fresh(){const a=perm(11);S={arr:a,disp:a.slice(),g:null,ev:0,cmp:0,cmpA:0,cmpB:0,phase:'idle',hl:new Array(N).fill(-9),on:0,sorted:-9,sweep:-9,flash:-9,smooth:30,sp:[]}}
function at(t,fn){events.push({t,fn});events.sort((a,b)=>a.t-b.t)}
function flt(txt,x,y,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;fx.appendChild(d);setTimeout(()=>d.remove(),1950)}
const ang=i=>-Math.PI/2+i/N*2*Math.PI;
window.__sort={st:()=>({phase:S.phase,cmpA:S.cmpA,cmpB:S.cmpB,sorted:S.arr.every((v,i)=>v===i),sortedAt:S.sorted})};

/* ================= timeline ================= */
function buildTimeline(){
 const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.6,.12);for(let k=0;k<32;k++)at(E+k*.036,()=>sfx.note(S.arr[(k*3)%N],Math.cos(ang(k*3))*.7,.03))});
 a(3.0,()=>flt('shuffled. no order at all.',250,242,'#e9eff8'));
 a(3.4,()=>{S.phase='bubble';S.g=bubble(S.arr);S.ev=0;S.cmp=0;sfx.start();flt('bubble sort: compare neighbours, swap',250,242,'#ff9d5c')});
 a(6.2,()=>flt('only the big ones bubble up…',250,242,'#ff9d5c'));
 a(8.3,()=>{S.cmpA=S.cmp;S.phase='frozen';S.g=null;flt('not even close',250,242,'#ff9d5c')});
 a(8.4,()=>{S.arr=perm(33);S.smooth=8;S.hl.fill(-9);sfx.shuffle();flt('reshuffle',250,242,'#e9eff8')});
 a(8.9,()=>{S.smooth=30;S.phase='quick';S.g=quick(S.arr);S.ev=0;S.cmp=0;sfx.start();flt('quicksort: divide and conquer',250,242,'#67e8f9')});
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact();S.flash=E});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function stat(x,label,val,sub,hue,al,align){g.textAlign=align;g.fillStyle=`rgba(150,170,210,${.85*al})`;g.font=`700 9px ${MONO}`;g.fillText(label,x,706);
 g.fillStyle=`hsla(${hue},95%,72%,${al})`;g.font='800 26px "Outfit",system-ui,sans-serif';g.fillText(val,x,732);g.fillStyle=`hsla(${hue},80%,78%,${.85*al})`;g.font=`700 9px ${MONO}`;g.fillText(sub,x,746)}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 /* run the algorithm: events per frame follow a timeline-driven schedule */
 let last=null;
 if(S.g&&(S.phase==='bubble'||S.phase==='quick')){
  const tau=E-3.4,tg=S.phase==='bubble'?Math.floor(60*tau+19*tau*tau*tau):Math.floor(520*Math.max(0,E-8.9));let n=0;
  while(S.ev<tg&&S.g&&n<400){const r=S.g.next();if(r.done){S.g=null;break}S.ev++;n++;const e=r.value;if(e.k==='c')S.cmp++;S.hl[e.i]=E;S.hl[e.j]=E;last=e}
  if(S.phase==='bubble'&&S.cmp)S.cmpA=S.cmp;
  if(S.phase==='quick'){S.cmpB=S.cmp;if(!S.g&&S.sorted<0){S.sorted=E;S.sweep=E;S.flash=E;sfx.chord(.08);flt('✓ sorted',250,242,'#6ee7b7');for(let k=0;k<24;k++)at(E+k*.04,()=>sfx.sweep(k))}}
 }
 if(last&&Math.random()<2)sfx.note(S.arr[last.i],Math.cos(ang(last.i))*.7,last.k==='s'?.05:.03);
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const fl=Math.exp(-(E-S.flash)*2.5),sw=S.sweep>0?(E-S.sweep)/.9*N:-1;
 /* backdrop glow that follows the sort */
 g.globalCompositeOperation='lighter';glow(CX,CY,250,S.phase==='quick'||S.sorted>0?190:25,.18+.25*fl);g.globalCompositeOperation='source-over';
 /* bars */
 const k=Math.min(1,dt*S.smooth);g.lineCap='butt';
 for(let i=0;i<N;i++){S.disp[i]+=(S.arr[i]-S.disp[i])*k;
  const ta=1.5+i*.012,u=ease((E-ta)/.45)*(S.on>0?1:0);if(u<=0)continue;
  const v=S.disp[i],len=(14+v/(N-1)*120)*u,a=ang(i),c=Math.cos(a),s=Math.sin(a),hot=E-S.hl[i]<.09,swp=sw>=0&&Math.abs(i-sw)<3,h=v/N*300;
  const r1=R0,r2=R0+len;
  g.strokeStyle=hot||swp?'rgba(255,255,255,.98)':`hsl(${h},92%,${55+8*fl}%)`;g.lineWidth=hot||swp?5.2:3.9;
  g.beginPath();g.moveTo(CX+c*r1,CY+s*r1);g.lineTo(CX+c*r2,CY+s*r2);g.stroke();
  if(hot||swp){g.globalCompositeOperation='lighter';glow(CX+c*r2,CY+s*r2,16,h,.9);g.globalCompositeOperation='source-over'}}
 /* hub */
 const ha=ease((E-S.on-.3)/.5)*(S.on>0?1:0);
 if(ha>0){g.fillStyle=`rgba(6,9,22,${.9*ha})`;g.beginPath();g.arc(CX,CY,R0-8,0,7);g.fill();g.strokeStyle=`rgba(255,255,255,${.14*ha})`;g.lineWidth=1.2;g.stroke();
  const nm=S.phase==='bubble'||S.phase==='frozen'?'BUBBLE SORT':S.phase==='quick'?(S.sorted>0?'QUICKSORT ✓':'QUICKSORT'):'READY',cnt=S.phase==='quick'?S.cmpB:S.cmpA,col=S.phase==='quick'?190:25;
  g.textAlign='center';g.fillStyle=`hsla(${col},90%,72%,${ha})`;g.font=`800 8.5px ${MONO}`;g.fillText(nm,CX,CY-12);
  g.fillStyle=`rgba(255,255,255,${ha})`;g.font='800 22px "Outfit",system-ui,sans-serif';g.fillText(cnt.toLocaleString('en-US'),CX,CY+10);
  g.fillStyle=`rgba(150,170,210,${.8*ha})`;g.font=`700 7.5px ${MONO}`;g.fillText('COMPARISONS',CX,CY+24)}
 /* stats row */
 const la=ease((E-8.3)/.4)*(1-ease((E-12.2)/.3)),ra=ease((E-8.9)/.4)*(1-ease((E-12.2)/.3));
 if(la>.01)stat(36,'BUBBLE SORT',S.cmpA.toLocaleString('en-US'),'comparisons · NOT DONE ✗',25,la,'left');
 if(ra>.01)stat(460,'QUICKSORT',S.cmpB.toLocaleString('en-US'),S.sorted>0?'comparisons · DONE ✓':'comparisons',190,ra,'right');
 if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.12*fl})`;g.fillRect(0,0,540,960);g.globalCompositeOperation='source-over'}
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');   /* hint: tap once to enable sound */
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);   /* starts by itself, so the first frame is the beginning */
})();
