(function(){const t=TER.getContext('2d');t.scale(2,2);const gr=t.createLinearGradient(0,0,0,424);gr.addColorStop(0,'#0c1226');gr.addColorStop(1,'#080c1a');t.fillStyle=gr;t.fillRect(0,0,424,424);

 for(let j=0;j<GW;j++)for(let i=0;i<GW;i++){if(!OB[j*GW+i])continue;const x=i*CS,y=j*CS;t.fillStyle='#1b2548';t.fillRect(x-.3,y-.3,CS+.6,CS+.6);t.fillStyle='rgba(0,0,0,.35)';t.fillRect(x+CS*.6,y+CS*.6,CS*.4,CS*.4);t.fillStyle='rgba(150,185,255,.22)';t.fillRect(x,y,CS,1.2);t.fillRect(x,y,1.2,CS)}
 t.strokeStyle='rgba(120,170,255,.55)';t.lineWidth=1.1;for(let j=0;j<GW;j++)for(let i=0;i<GW;i++){if(!OB[j*GW+i])continue;const x=i*CS,y=j*CS;
  [[0,-1,x,y,x+CS,y],[1,0,x+CS,y,x+CS,y+CS],[0,1,x,y+CS,x+CS,y+CS],[-1,0,x,y,x,y+CS]].forEach(([dx,dy,a,b,c,d])=>{const nx=i+dx,ny=j+dy,fr=nx<0||ny<0||nx>=GW||ny>=GW||!OB[ny*GW+nx];if(fr){t.beginPath();t.moveTo(a,b);t.lineTo(c,d);t.stroke()}})}})();
let S,E=0,events=[],gen=0,raf=null,lastF=0;
function fresh(){S={phase:'idle',g:null,par:null,gc:null,order:[],ev:0,cnt:{b:0,a:0},plen:{b:0,a:0},path:null,pathT:-9,pathLen:0,wipe:-9,on:0,flash:-9,done:{b:-9,a:-9},sp:[],mark:0,which:'b'}}
function at(t,fn){events.push({t,fn});events.sort((a,b)=>a.t-b.t)}
function flt(txt,x,y,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;fx.appendChild(d);setTimeout(()=>d.remove(),1950)}
function burst(x,y,h,n=22){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=30+Math.random()*110;S.sp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7+Math.random()*.5,t:E,h:h+Math.random()*30-15})}}
const cc=i=>[PX+(i%GW+.5)*CS,PY+(Math.floor(i/GW)+.5)*CS];
function begin(w){S.which=w;S.phase=w==='b'?'bfs':'astar';S.par=new Int32Array(GW*GW).fill(-2);S.gc=new Int32Array(GW*GW).fill(1e9);S.g=search(w==='a',S.par,S.gc);S.order=[];S.ev=0;S.path=null;S.pathT=-9;sfx.start()}
function finish(){const w=S.which;let p=GI;const path=[];while(p>=0){path.push(p);p=S.par[p]}path.reverse();S.path=path;S.pathT=E;S.plen[w]=path.length-1;S.done[w]=E;S.phase=w==='b'?'bfsdone':'adone';
 for(let k=0;k<path.length;k+=2)at(E+k*.013,()=>sfx.trace(Math.floor(k/path.length*14)));
 at(E+path.length*.013+.05,()=>{S.flash=E;sfx.chord(.07);const c=cc(GI);burst(c[0],c[1],w==='b'?190:45,26)})}
window.__pf={st:()=>({phase:S.phase,b:S.cnt.b,a:S.cnt.a,lb:S.plen.b,la:S.plen.a})};

/* ================= timeline ================= */
function buildTimeline(){
 const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.6,.12);for(let k=0;k<20;k++)at(E+k*.04,()=>sfx.vis(k*3,(k%2?.4:-.4)))});
 a(2.6,()=>{S.mark=E;sfx.pop();setTimeout(()=>{},0);at(E+.2,()=>sfx.pop());flt('start → goal',250,242,'#e9eff8')});
 a(3.4,()=>{begin('b');flt('BFS: check every neighbour, ring by ring',250,242,'#67e8f9')});
 a(8.0,()=>{S.wipe=E;sfx.whoosh(.5,.1,true)});
 a(8.4,()=>{S.order=[];S.path=null;S.pathT=-9;S.phase='clear'});
 a(8.6,()=>{begin('a');flt('A*: aim at the goal (slow motion)',250,242,'#ffb454')});
 a(10.9,()=>flt('same path. ~9× fewer cells.',250,242,'#6ee7b7'));
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact();S.flash=E});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function stat(x,label,val,sub,hue,al,align){g.textAlign=align;g.fillStyle=`rgba(150,170,210,${.85*al})`;g.font=`700 9px ${MONO}`;g.fillText(label,x,706);
 g.fillStyle=`hsla(${hue},95%,72%,${al})`;g.font='800 26px "Outfit",system-ui,sans-serif';g.fillText(val,x,732);g.fillStyle=`hsla(${hue},80%,78%,${.85*al})`;g.font=`700 9px ${MONO}`;g.fillText(sub,x,746)}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 if(S.g&&(S.phase==='bfs'||S.phase==='astar')){const tg=S.phase==='bfs'?Math.floor(300*(E-3.4)):Math.floor(100*(E-8.6));let n=0,last=null;
  while(S.ev<tg&&S.g&&n<200){const r=S.g.next();if(r.done){S.g=null;break}S.ev++;n++;S.order.push({c:r.value.c,g:r.value.g,t:E});last=r.value;if(r.value.c===GI){S.g=null;break}}
  S.cnt[S.which]=S.order.length;if(last&&n)sfx.vis(last.g,(cc(last.c)[0]-270)/212*.7);
  if(!S.g&&S.order.length&&S.order[S.order.length-1].c===GI&&S.pathT<0)finish()}
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const pa=ease((E-S.on)/.8)*(S.on>0?1:0),fl=Math.exp(-(E-S.flash)*2.5),wk=ease((E-S.wipe)/.35),hueB=S.which==='b';
 if(pa>0){g.save();g.translate(PX+212,PY+212);g.scale(.94+.06*pa,.94+.06*pa);g.translate(-PX-212,-PY-212);g.globalAlpha=pa;
  g.globalCompositeOperation='lighter';glow(PX+212,PY+212,300,hueB?200:40,.12+.18*fl);g.globalCompositeOperation='source-over';
  g.save();rr(PX,PY,424,424,16);g.clip();g.drawImage(TER,PX,PY,424,424);
  /* explored cells */
  g.globalCompositeOperation='lighter';const maxG=hueB?68:66;
  for(const o of S.order){const x=PX+(o.c%GW)*CS,y=PY+Math.floor(o.c/GW)*CS,age=E-o.t,a=ease(age/.35)*((S.phase==='clear'||(S.phase==='bfsdone'&&S.wipe>0))?1-wk:1),f=clamp(o.g/maxG,0,1),h=hueB?190+120*f:55-45*f;
   g.fillStyle=`hsla(${h},95%,${50+10*(1-f)}%,${.55*a})`;g.fillRect(x+.5,y+.5,CS-1,CS-1);
   if(age<.18){g.fillStyle=`rgba(255,255,255,${.85*(1-age/.18)*a})`;g.fillRect(x,y,CS,CS)}}
  /* path */
  if(S.path&&S.pathT>0){const prog=clamp((E-S.pathT)/(S.path.length*.013),0,1)*(S.path.length-1),pk=1-((S.phase==='clear'||(S.phase==='bfsdone'&&S.wipe>0))?wk:0);
   for(let pass=0;pass<2;pass++){g.strokeStyle=pass?'rgba(255,245,200,.98)':'rgba(255,200,60,.5)';g.lineWidth=pass?2.4:7;g.lineJoin='round';g.beginPath();
    for(let k=0;k<=Math.floor(prog);k++){const c=cc(S.path[k]);k?g.lineTo(c[0],c[1]):g.moveTo(c[0],c[1])}if(prog%1>0&&prog<S.path.length-1){const a=cc(S.path[Math.floor(prog)]),b=cc(S.path[Math.floor(prog)+1]),f=prog%1;g.lineTo(lerp(a[0],b[0],f),lerp(a[1],b[1],f))}g.globalAlpha=pa*pk;g.stroke();g.globalAlpha=pa}
   const hd=cc(S.path[Math.min(Math.floor(prog),S.path.length-1)]);glow(hd[0],hd[1],22,48,.95*pk)}
  g.globalCompositeOperation='source-over';g.restore();
  /* start + goal markers */
  const mk=ease((E-S.mark)/.4)*(S.mark>0?1:0);if(mk>0){const s0=cc(SI),g0=cc(GI),pu=.7+.3*Math.sin(E*5);g.globalCompositeOperation='lighter';
   glow(s0[0],s0[1],26,140,.9*mk*pu);glow(g0[0],g0[1],30,335,.95*mk*pu);g.globalCompositeOperation='source-over';
   g.fillStyle=`rgba(255,255,255,${mk})`;g.beginPath();g.arc(s0[0],s0[1],4.5,0,7);g.fill();g.beginPath();g.arc(g0[0],g0[1],4.5,0,7);g.fill();
   g.font=`800 8px ${MONO}`;g.textAlign='center';g.fillStyle=`rgba(150,255,190,${mk})`;g.fillText('START',s0[0],s0[1]+17);g.fillStyle=`rgba(255,150,210,${mk})`;g.fillText('GOAL',g0[0],g0[1]+17)}
  /* frame + algorithm tag */
  g.lineWidth=2;const gr=g.createLinearGradient(PX,PY,PX+424,PY+424);gr.addColorStop(0,'rgba(103,232,249,.9)');gr.addColorStop(1,'rgba(255,180,84,.9)');g.strokeStyle=gr;rr(PX,PY,424,424,16);g.stroke();
  if(S.phase!=='idle'){const nm=hueB?'BFS':'A*',slow=!hueB&&S.phase==='astar';g.fillStyle='rgba(4,6,16,.7)';rr(PX+10,PY+10,slow?118:50,24,8);g.fill();g.textAlign='left';g.fillStyle=hueB?'#67e8f9':'#ffb454';g.font=`800 12px ${MONO}`;g.fillText(nm,PX+19,PY+26);
   if(slow){g.fillStyle='rgba(255,255,255,.75)';g.font=`700 8px ${MONO}`;g.fillText('SLOW-MO ×3',PX+52,PY+25)}}
  g.restore()}
 g.globalAlpha=1;
 const fa=1-ease((E-12.2)/.3),la=ease((E-3.6)/.4)*fa,ra=ease((E-8.8)/.4)*fa;
 if(la>.01)stat(36,'BFS · FLOODS',S.cnt.b.toLocaleString('en-US'),S.plen.b?'cells · path '+S.plen.b+' ✓':'cells explored',190,la,'left');
 if(ra>.01)stat(460,'A* · AIMED',S.cnt.a.toLocaleString('en-US'),S.plen.a?'cells · path '+S.plen.a+' ✓':'cells explored',40,ra,'right');
 g.globalCompositeOperation='lighter';
 S.sp=S.sp.filter(s=>E-s.t<s.l);for(const s of S.sp){const a=1-(E-s.t)/s.l;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=80*dt;glow(s.x,s.y,6,s.h,a)}
 if(fl>.02){g.fillStyle=`rgba(255,255,255,${.1*fl})`;g.fillRect(0,0,540,960)}
 g.globalCompositeOperation='source-over';
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);

$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');   /* hint: tap once to enable sound */
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);   /* starts by itself, so the first frame is the beginning */
})();
