const polC=KER.map(()=>{const c=document.createElement('canvas');c.width=c.height=PW;return c}),polX=polC.map(c=>c.getContext('2d')),polD=polC.map((c,i)=>polX[i].createImageData(PW,PW));
(function(){const d=imgD.data;for(let k=0;k<IW*IW;k++){const v=IMG[k];d[k*4]=40+60*v;d[k*4+1]=120+135*v;d[k*4+2]=180+75*v;d[k*4+3]=Math.round(255*(.08+.92*v))}imgX.putImageData(imgD,0,0)})();
let S,E=0,events=[],gen=0,raf=null,lastF=0;

/* ================= timeline ================= */
function buildTimeline(){
 const a=at;

 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.6,.12)});
 a(2.3,()=>flt('a 28×28 image. just numbers.',250,242,'#e9eff8'));
 a(2.8,()=>flt('slide a tiny 3×3 filter across it',250,242,'#67e8f9'));
 a(3.0,()=>{S.stage='scan';sfx.start()});
 a(4.6,()=>flt('multiply · add · repeat',250,242,'#e9eff8'));
 a(7.5,()=>{S.stage='relu';S.reluT=E;sfx.relu();flt('+ ReLU: drop the negatives',250,242,'#ff6ec7')});
 a(8.7,()=>{S.stage='pool';S.poolT=E;sfx.pool();flt('+ max pool: keep the strongest, halve the size',250,242,'#67e8f9')});
 a(10.2,()=>{S.stage='done';S.flash=E;sfx.chord(.07);for(let i=0;i<3;i++)at(E+i*.12,()=>sfx.ping(i));flt('3 feature maps: edges found',250,242,'#6ee7b7')});
 a(11.2,()=>flt('deeper layers combine edges into shapes',250,242,'#e9eff8'));
 a(11.7,()=>sfx.whoosh(.85,.1));

}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */

 g.fillStyle=`hsla(${hue},95%,72%,${al})`;g.font='800 24px "Outfit",system-ui,sans-serif';g.fillText(val,x,734)}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 if(S.stage==='scan'){const tau=E-3.0,tg=Math.min(CW*CW,Math.floor(6*tau+34*tau*tau)),prev=S.pos;S.pos=Math.max(S.pos,tg);if(S.pos>prev){const p=S.pos-1;for(let k=0;k<3;k++)if(k===0||p%3===0)sfx.cv(CONV[k][Math.min(p,CW*CW-1)],k)}}

 const pa=ease((E-S.on)/.7)*(S.on>0?1:0),fl=Math.exp(-(E-S.flash)*2.5);

 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 if(pa>0){g.globalAlpha=pa;g.globalCompositeOperation='lighter';glow(250,450,300,215,.1+.2*fl);g.globalCompositeOperation='source-over';
  /* input image */
  g.fillStyle='rgba(6,10,24,.9)';rr(IX-6,IY-6,IW*IC+12,IW*IC+12,10);g.fill();g.imageSmoothingEnabled=false;g.drawImage(imgC,IX,IY,IW*IC,IW*IC);
  g.globalCompositeOperation='lighter';g.globalAlpha=pa*.5;g.imageSmoothingEnabled=true;g.drawImage(imgC,IX,IY,IW*IC,IW*IC);g.globalAlpha=pa;g.globalCompositeOperation='source-over';
  g.strokeStyle='rgba(103,232,249,.7)';g.lineWidth=1.6;rr(IX-6,IY-6,IW*IC+12,IW*IC+12,10);g.stroke();
  g.fillStyle='rgba(150,170,210,.9)';g.font=`700 8.5px ${MONO}`;g.textAlign='left';g.fillText('INPUT · 28×28 PIXELS',IX,IY-12);
  /* sliding window + calculator */
  const p=Math.min(S.pos,CW*CW-1),wi=p%CW,wj=Math.floor(p/CW),scan=S.stage==='scan'&&S.pos>0&&S.pos<CW*CW;
  if(S.stage==='scan'||S.pos>0&&S.stage==='idle'){const x=IX+wi*IC,y=IY+wj*IC;g.globalCompositeOperation='lighter';glow(x+IC*1.5,y+IC*1.5,30,45,.8);g.globalCompositeOperation='source-over';g.strokeStyle='rgba(255,230,140,1)';g.lineWidth=1.6;g.strokeRect(x,y,IC*3,IC*3)}
  const px=234,py=284;g.fillStyle='rgba(6,10,24,.85)';rr(px-8,py-18,224,128,10);g.fill();g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=1;g.stroke();
  g.fillStyle='rgba(150,170,210,.9)';g.font=`700 8px ${MONO}`;g.fillText('PIXEL PATCH',px,py-6);g.fillText('FILTER → RESULT',px+98,py-6);
  const patchOn=S.stage==='scan'||S.pos>0;
  for(let b=0;b<3;b++)for(let a2=0;a2<3;a2++){const v=patchOn?IMG[(wj+b)*IW+wi+a2]:0;g.fillStyle=`rgba(103,232,249,${.12+.6*v})`;rr(px+a2*26,py+b*26,24,24,4);g.fill();g.fillStyle='#fff';g.font=`800 9px ${MONO}`;g.textAlign='center';g.fillText(patchOn?v.toFixed(1):'·',px+a2*26+12,py+b*26+15)}
  KER.forEach((K,k)=>{const y=py+k*36;for(let b=0;b<3;b++)for(let a2=0;a2<3;a2++){const w=K.k[b*3+a2];g.fillStyle=w>0?`hsla(${K.h},85%,60%,${.3+.15*w})`:w<0?`rgba(255,90,200,${.25+.15*-w})`:'rgba(120,140,200,.15)';g.fillRect(px+98+a2*9,y+b*9,8,8)}
   const val=patchOn?CONV[k][p]:0,rv=S.stage==='scan'||S.pos?val:0;g.textAlign='left';g.fillStyle=rv>=0?`hsla(${K.h},95%,72%,1)`:'rgba(255,120,210,1)';g.font=`800 12px ${MONO}`;g.fillText((rv>=0?'+':'')+rv.toFixed(2),px+132,y+19)});
  g.textAlign='left';
  /* feature maps */
  KER.forEach((K,k)=>{const x=MX[k],d=mapD[k].data,cnt=S.pos;
   for(let n=0;n<CW*CW;n++){const o=n*4;if(n<cnt){let v=CONV[k][n];if(rk>0)v=lerp(v,Math.max(0,v),rk);const s=clamp(v/VMAX,-1,1),as=Math.abs(s);
     if(s>=0){d[o]=30+25*s;d[o+1]=120+135*s;d[o+2]=170+85*s}else{d[o]=255;d[o+1]=60;d[o+2]=190}d[o+3]=Math.round(255*clamp(as*1.15+.06,0,1))}else d[o+3]=0}
   mapX[k].putImageData(mapD[k],0,0);
   const pd=polD[k].data;for(let n=0;n<PW*PW;n++){const o=n*4,s=clamp(POOL[k][n]/VMAX,0,1);pd[o]=30+25*s;pd[o+1]=120+135*s;pd[o+2]=170+85*s;pd[o+3]=Math.round(255*clamp(s*1.2+.05,0,1))}polX[k].putImageData(polD[k],0,0);
   const SZ=CW*MC;g.fillStyle='rgba(6,10,24,.9)';rr(x-5,MY-5,SZ+10,SZ+10,9);g.fill();

   g.strokeStyle=`hsla(${K.h},90%,66%,.85)`;g.lineWidth=1.4;rr(x-5,MY-5,SZ+10,SZ+10,9);g.stroke();
   if(scan&&k>=0){const ci=wi*MC,cj=wj*MC;g.fillStyle='rgba(255,230,140,.95)';g.fillRect(x+ci-1,MY+cj-1,MC+2,MC+2)}
   g.fillStyle=`hsla(${K.h},90%,76%,1)`;g.font=`800 8px ${MONO}`;g.textAlign='center';g.fillText(K.n,x+SZ/2,MY+SZ+20)});
  g.textAlign='left';g.fillStyle='rgba(150,170,210,.9)';g.font=`700 8.5px ${MONO}`;
  const stg=S.stage==='pool'||S.stage==='done'?'FEATURE MAPS · CONV → ReLU → MAX POOL (13×13)':S.stage==='relu'?'FEATURE MAPS · CONV → ReLU':'FEATURE MAPS · CONVOLUTION OUTPUT';
  if(S.on>0)g.fillText(stg,MX[0]-5,MY-14);
  g.globalAlpha=1;
  if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.08*fl})`;g.fillRect(0,0,540,960)}}
 g.globalCompositeOperation='source-over';g.globalAlpha=1;
 const sa=ease((E-3.0)/.4)*(1-ease((E-12.2)/.3));
 if(sa>.01){const p=Math.min(S.pos,CW*CW);stat(36,'POSITION',p>0?`${Math.min(p,CW*CW)} / ${CW*CW}`:'—',190,sa,'left');
  stat(250,'STAGE',S.stage==='scan'?'CONVOLVE':S.stage==='relu'?'ReLU':S.stage==='pool'?'MAX POOL':S.stage==='done'?'DONE':'—',320,sa,'center');
  stat(460,'MAP SIZE',S.stage==='pool'||S.stage==='done'?'13×13':'26×26',45,sa,'right')}
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}

$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};

 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
