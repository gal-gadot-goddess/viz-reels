let S,E=0,events=[],gen=0,raf=null,lastF=0;
function fresh(){S={on:0,flash:-9,lossFlash:-9}}
function at(t,fn){events.push({t,fn});events.sort((a,b)=>a.t-b.t)}
function flt(txt,x,y,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col;fx.appendChild(d);setTimeout(()=>d.remove(),1950)}
window.__bp={st:()=>({y:ITER.map(i=>+i.y.toFixed(3)),loss:ITER.map(i=>+i.loss.toFixed(4))})};

/* ================= timeline ================= */
const FP=[0,.38/3,.38*2/3,.38],BP=[.52,.52+.34/3,.52+.34*2/3,.86];
function buildTimeline(){
 const a=at;
 a(.2,()=>{$('#kick').classList.add('show');sfx.ui()});
 a(.55,()=>{$('#title').classList.add('show');sfx.thump()});
 a(1.0,()=>{$('#sub').classList.add('show');sfx.ui()});
 a(1.5,()=>{S.on=E;sfx.zap();sfx.whoosh(.7,.12)});
 a(2.4,()=>flt('a tiny network. one example. target = 1.0',250,242,'#e9eff8'));
 ITS.forEach((it,k)=>{const full=k<3;
  if(full){for(let l=0;l<4;l++)a(it.t+FP[l]*it.d,()=>sfx.fwd(l));a(it.t+.4*it.d,()=>sfx.bad());for(let l=0;l<3;l++)a(it.t+BP[l]*it.d,()=>sfx.bwd(l));for(let q=0;q<4;q++)a(it.t+(.87+q*.03)*it.d,()=>sfx.upd(q+k*2))}
  else a(it.t,()=>sfx.blip(ITER[k+1].y))});
 a(3.0,()=>flt('1 · forward: data flows in',250,242,'#67e8f9'));
 a(4.3,()=>flt(`2 · loss: guessed ${ITER[0].y.toFixed(2)}, wanted 1.00`,250,242,'#ff8a8a'));
 a(4.95,()=>flt('3 · backward: blame flows back',250,242,'#ffb454'));
 a(5.85,()=>flt('4 · update: nudge every weight',250,242,'#6ee7b7'));
 a(6.5,()=>flt('again, with better weights',250,242,'#e9eff8'));
 a(9.25,()=>flt('repeat. repeat. repeat.',250,242,'#e9eff8'));
 a(11.9,()=>{S.flash=E;sfx.chord(.08);flt(`✓ ${ITER[0].y.toFixed(2)} → ${ITER[NIT].y.toFixed(2)} in ${NIT} rounds`,250,242,'#6ee7b7')});
 a(11.7,()=>sfx.whoosh(.85,.1));
 a(12.5,()=>{$('#punch').classList.add('show');sfx.impact()});
}
function resetDom(){document.querySelectorAll('.rev').forEach(n=>n.classList.remove('show'));$('#punch').classList.remove('show');fx.innerHTML=''}
function startPlay(){gen++;fresh();events=[];resetDom();if(ac){newBus();A0=ac.currentTime+.04}start=performance.now();playing=true;lastF=0;buildTimeline();music();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

/* ================= render ================= */
function stat(x,label,val,hue,al,align){g.textAlign=align;g.fillStyle=`rgba(150,170,210,${.85*al})`;g.font=`700 9px ${MONO}`;g.fillText(label,x,706);
 g.fillStyle=`hsla(${hue},95%,72%,${al})`;g.font='800 28px "Outfit",system-ui,sans-serif';g.fillText(val,x,736)}
function frame(){
 if(!playing)return;E=(performance.now()-start)/1000;const dt=Math.min(.05,E-lastF);lastF=E;
 while(events.length&&events[0].t<=E)events.shift().fn();
 ANG=.28*Math.sin(E*.5)-.1;
 /* which iteration / phase */
 let k=-1,u=0;for(let i=0;i<NIT;i++){if(E>=ITS[i].t){k=i;u=(E-ITS[i].t)/ITS[i].d}}
 const done=k>=0&&u>=1,K=k<0?0:(done?NIT:k),it=ITER[Math.min(K,NIT)];
 const fast=k>=3&&!done;
 /* displayed weights */
 let Wd=ITER[Math.max(0,Math.min(k<0?0:k,NIT))].W;
 if(k>=0&&!done&&u>BP[3]){const kk=ease((u-BP[3])/(1-BP[3])),Wn=ITER[k+1].W;Wd=Wd.map((m,l)=>m.map((row,j)=>row.map((w,i)=>lerp(w,Wn[l][j][i],kk))))}
 else if(done)Wd=ITER[NIT].W;
 else if(k>=0&&u>=1)Wd=ITER[k+1].W;
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,540,960);g.globalCompositeOperation='source-over';
 const pa=ease((E-S.on)/.8)*(S.on>0?1:0),fl=Math.exp(-(E-S.flash)*2.5);
 if(pa>0){
  /* node positions */
  const NP=SZ.map((n,l)=>Array.from({length:n},(_,i)=>proj(NX[l][i],LY[l],(l-1.5)*.45)));
  g.globalCompositeOperation='lighter';glow(250,480,300,265,.12+.25*fl);
  /* edges */
  for(let l=0;l<3;l++)for(let j=0;j<SZ[l+1];j++)for(let i=0;i<SZ[l];i++){const w=Wd[l][j][i],a=NP[l][i],b=NP[l+1][j];
   const fp=k>=0?clamp((u-FP[l])/(FP[l+1]-FP[l]||1),0,1):0,fwdOn=k>=0&&(u>=FP[l+1]||done)?1:0,bw=k>=0&&!done&&u>=BP[l]?1:(done?0:0),gm=Math.abs(it.gW[l][j][i]);
   const bwp=k>=0&&!done?clamp((u-BP[2-l])/((BP[3-l]-BP[2-l])||1),0,1):0;
   let hue=w>0?190:320,al=.28+.2*Math.min(1,Math.abs(w));
   if(k>=0&&!done&&u<BP[0]&&fp>0&&fp<1)al+=.5*Math.sin(fp*3.14);
   if(k>=0&&!done&&u>=BP[2-l]&&u<=BP[3-l]+.04){hue=40;al+=Math.min(.7,gm*6)}
   g.strokeStyle=`hsla(${hue},95%,62%,${al*pa})`;g.lineWidth=.5+Math.abs(w)*2.8*(a[3]/89);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
   if(k>=0&&!done&&fp>0&&fp<1&&u<BP[0]){const x=lerp(a[0],b[0],fp),y=lerp(a[1],b[1],fp);glow(x,y,10,190,.85*pa)}
   if(k>=0&&!done&&u>=BP[2-l]&&u<=BP[3-l]){const q=1-bwp,x=lerp(a[0],b[0],q),y=lerp(a[1],b[1],q);glow(x,y,10+Math.min(10,gm*60),40,.9*pa)}}
  /* nodes */
  g.globalCompositeOperation='source-over';
  NP.forEach((row,l)=>row.forEach((p,i)=>{const rv=k<0?0:(done?1:(u>=FP[l]?1:0)),av=k<0?0:ease((u-FP[l])/.06)*(done?1:1),rad=15*p[3]/89,val=it.a[l][i],grd=l>0&&k>=0&&!done&&u>=BP[3-l]?1:0;
   const hot=l===3&&k>=0&&!done&&u>=.38&&u<.6;
   g.globalCompositeOperation='lighter';glow(p[0],p[1],rad*2.2,hot?0:(l===3?320:200),(.25+.5*Math.abs(val>1?1:Math.abs(val)))*pa*(k<0?.4:1));g.globalCompositeOperation='source-over';
   g.fillStyle=`rgba(8,12,30,.92)`;g.beginPath();g.arc(p[0],p[1],rad,0,7);g.fill();g.strokeStyle=hot?`rgba(255,90,90,${.9*pa})`:`rgba(160,210,255,${.8*pa})`;g.lineWidth=1.4;g.stroke();
   if(rv&&!fast){g.fillStyle=`rgba(255,255,255,${av*pa})`;g.font=`800 ${Math.round(9*p[3]/89)}px ${MONO}`;g.textAlign='center';g.fillText(val.toFixed(2),p[0],p[1]+3.2)}
   if(grd&&!fast&&l>0){const dv=it.D[l][i],ga=ease((u-BP[3-l])/.06);g.fillStyle=`rgba(255,185,80,${ga*pa})`;g.font=`800 ${Math.round(8*p[3]/89)}px ${MONO}`;g.fillText('δ'+dv.toFixed(2),p[0],p[1]+rad+11*p[3]/89)}}));
  /* layer labels */
  g.fillStyle=`rgba(150,170,210,${.8*pa})`;g.font=`700 7.5px ${MONO}`;g.textAlign='left';['INPUT','HIDDEN','HIDDEN','OUTPUT'].forEach((t,l)=>g.fillText(t,36,NP[l][0][1]+3))
  /* target marker at output */
  const op=NP[3][0];g.fillStyle=`rgba(110,240,170,${.9*pa})`;g.font=`800 8px ${MONO}`;g.textAlign='left';g.fillText('target 1.00',op[0]+26,op[1]+3);
  if(k>=0&&!done&&u>=.38&&u<.62&&k<3){g.fillStyle=`rgba(255,110,110,${.95*pa*Math.sin(clamp((u-.38)/.24,0,1)*3.14)})`;g.font=`800 11px ${MONO}`;g.textAlign='center';g.fillText('✗ wrong by '+(TG-it.y).toFixed(2),op[0],op[1]+34)}
  if(fl>.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,255,255,${.1*fl})`;g.fillRect(0,0,540,960)}}
 g.globalCompositeOperation='source-over';g.globalAlpha=1;
 /* stats */
 const sa=ease((E-3.0)/.4)*(1-ease((E-12.2)/.3));
 if(sa>.01){const showY=k<0?null:(u>.38||done||k>0?it.y:(ITER[Math.max(0,k-1)].y));const yy=k<0?'—':(done?ITER[NIT].y:(u>.38?it.y:(k>0?ITER[k].y:0)));
  stat(36,'PREDICTION',k<0?'—':(done?ITER[NIT].y:(u>=.38||k>0?it.y:it.y)).toFixed(2),190,sa,'left');stat(250,'TARGET','1.00',140,sa,'center');stat(460,'LOSS',k<0?'—':(done?ITER[NIT].loss:it.loss).toFixed(3),k>=0&&(done?ITER[NIT].loss:it.loss)<.01?140:20,sa,'right')}
 raf=requestAnimationFrame(frame)}

/* ================= grain / controls / boot ================= */
(function(){try{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),im=x.createImageData(120,120);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=30}x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();
audioInit();
function unlock(){if(!ac||ac.state!=='suspended')return;ac.resume().then(()=>{if(playing&&(performance.now()-start)/1000<12)startPlay()}).catch(()=>{});$('#ui').classList.remove('keep')}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
const setSnd=()=>{muted=!muted;if(master)master.gain.value=muted?0:.62;$('#bSnd').textContent=muted?'🔇 Sound':'🔊 Sound'};
$('#bSnd').onclick=setSnd;$('#bMus').onclick=()=>{musicOn=!musicOn;$('#bMus').style.opacity=musicOn?1:.5;startPlay()};
$('#bRep').onclick=()=>{unlock();startPlay()};$('#bGd').onclick=()=>{const d=$('#guide').style;d.display=d.display==='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='r'||e.key==='R'){e.preventDefault();startPlay()}
 if(e.key==='m'||e.key==='M')setSnd();if(e.key==='b'||e.key==='B')$('#bMus').click();if(e.key==='g'||e.key==='G')$('#bGd').click()});
let ht;const showUI=()=>{document.body.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show'),2500)};
addEventListener('pointermove',showUI);addEventListener('touchstart',showUI);
if(ac&&ac.state==='suspended')$('#ui').classList.add('keep');   /* hint: tap once to enable sound */
if(/[&?]loop=1/.test(location.search))setInterval(()=>{if(playing&&(performance.now()-start)/1000>17.5)startPlay()},500);
setTimeout(startPlay,180);   /* starts by itself, so the first frame is the beginning */
})();
</script>
